name: watch-internships

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min; GitHub may delay or skip runs when busy (re-registered 2026-11-16)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check new postings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PING: ${{ inputs.test }}
        run: python watcher.py
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.txt
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
          exit 1
