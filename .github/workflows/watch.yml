name: watch-internships

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may delay runs when busy)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check new postings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PING: ${{ inputs.test }}
        run: python watcher.py
      - name: Save state
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git add state/seen.txt
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git push)
